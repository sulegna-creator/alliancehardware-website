<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DAWN ERP | Progress</title>

  <style>
    :root {
      --navy: #081632;
      --navy-light: #10244d;
      --blue: #1f5eff;
      --green: #16a34a;
      --orange: #f59e0b;
      --gray: #64748b;
      --light: #f4f7fb;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: var(--light);
      color: var(--text);
    }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.7;
    }

    .private-label {
      font-size: 12px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      opacity: 0.9;
    }

    .container {
      width: min(1180px, 92%);
      margin: 40px auto 70px;
    }

    .hero {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(8, 22, 50, 0.06);
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .hero p {
      margin: 0;
      color: var(--gray);
      line-height: 1.6;
    }

    .overall {
      margin-top: 28px;
    }

    .overall-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .overall-title {
      font-weight: 700;
    }

    .overall-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--blue);
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #e8edf5;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--blue);
      border-radius: 20px;
      transition: width 0.8s ease;
    }

    .modules {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(310px, 1fr));
      gap: 18px;
    }

    .module {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 6px 20px rgba(8, 22, 50, 0.04);
    }

    .module-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 15px;
    }

    .module-name {
      font-size: 16px;
      font-weight: 800;
    }

    .status {
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 20px;
      background: #eef2f7;
      color: var(--gray);
    }

    .status.completed {
      background: #dcfce7;
      color: #166534;
    }

    .status.development {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.foundation {
      background: #fef3c7;
      color: #92400e;
    }

    .status.planned {
      background: #f1f5f9;
      color: #64748b;
    }

    .module-progress {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--gray);
    }

    .module-track {
      height: 8px;
      background: #edf1f6;
      border-radius: 20px;
      overflow: hidden;
    }

    .module-bar {
      height: 100%;
      width: 0;
      background: var(--blue);
      border-radius: 20px;
      transition: width 0.7s ease;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: var(--gray);
    }

    .error {
      color: #b91c1c;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .footer {
      text-align: center;
      color: var(--gray);
      font-size: 12px;
      margin-top: 35px;
    }

    @media (max-width: 650px) {

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding: 25px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .overall-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="brand">
      DAWN ERP
      <span>
        Digital Assistant for Workflow &amp; Networks
      </span>
    </div>

    <div class="private-label">
      Private Progress Portal
    </div>

  </header>


  <main class="container">

    <section class="hero">

      <h1>ERP Development Progress</h1>

      <p>
        Alliance Hardware's DAWN ERP development roadmap
        and current implementation status.
      </p>

      <div class="overall">

        <div class="overall-header">

          <div class="overall-title">
            Overall Development Progress
          </div>

          <div
            class="overall-value"
            id="overallProgress"
          >
            —
          </div>

        </div>

        <div class="progress-track">

          <div
            class="progress-bar"
            id="overallBar"
          ></div>

        </div>

      </div>

    </section>


    <section
      id="modules"
      class="modules"
    >

      <div class="loading">
        Loading DAWN ERP progress...
      </div>

    </section>


    <div class="footer">
      DAWN ERP • Alliance Hardware, Inc.
    </div>

  </main>


  <script>

    /*
     * =====================================================
     * LOAD DAWN ERP PROGRESS
     * =====================================================
     *
     * IMPORTANT:
     *
     * The browser does NOT communicate directly with DAWN.
     *
     * It communicates with the Netlify Function:
     *
     * /.netlify/functions/erp-progress
     *
     * The DAWN service token remains on the Netlify server.
     *
     */

    async function loadERPProgress() {

      const modulesContainer =
        document.getElementById("modules");

      try {

        const response =
          await fetch(
            "/.netlify/functions/erp-progress",
            {
              method: "GET",
              headers: {
                "Accept": "application/json"
              }
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Unable to load ERP progress."
          );

        }


        /*
         * ===============================================
         * OVERALL PROGRESS
         * ===============================================
         */

        const overall =
          Number(data.overallProgress) || 0;


        document.getElementById(
          "overallProgress"
        ).textContent =
          `${overall}%`;


        document.getElementById(
          "overallBar"
        ).style.width =
          `${overall}%`;


        /*
         * ===============================================
         * MODULES
         * ===============================================
         */

        if (
          !Array.isArray(data.modules) ||
          data.modules.length === 0
        ) {

          modulesContainer.innerHTML =
            `
              <div class="loading">
                No ERP modules are currently available.
              </div>
            `;

          return;

        }


        modulesContainer.innerHTML =
          data.modules
            .map(module => {

              const progress =
                Math.min(
                  100,
                  Math.max(
                    0,
                    Number(module.progress) || 0
                  )
                );


              const status =
                String(
                  module.status || ""
                );


              let statusClass =
                "planned";


              if (
                status.toLowerCase()
                  .includes("completed")
              ) {

                statusClass =
                  "completed";

              } else if (
                status.toLowerCase()
                  .includes("development")
              ) {

                statusClass =
                  "development";

              } else if (
                status.toLowerCase()
                  .includes("foundation")
              ) {

                statusClass =
                  "foundation";

              }


              return `
                <article class="module">

                  <div class="module-top">

                    <div class="module-name">
                      ${escapeHTML(
                        module.name || "Unnamed Module"
                      )}
                    </div>

                    <div
                      class="status ${statusClass}"
                    >
                      ${escapeHTML(status)}
                    </div>

                  </div>

                  <div class="module-progress">

                    <span>
                      Progress
                    </span>

                    <strong>
                      ${progress}%
                    </strong>

                  </div>

                  <div class="module-track">

                    <div
                      class="module-bar"
                      style="width:${progress}%"
                    ></div>

                  </div>

                </article>
              `;

            })
            .join("");


      } catch (error) {

        console.error(
          "ERP progress error:",
          error
        );


        modulesContainer.innerHTML =
          `
            <div class="error">
              Unable to load DAWN ERP progress.
            </div>
          `;

      }

    }


    /*
     * =====================================================
     * BASIC HTML ESCAPING
     * =====================================================
     *
     * Keeps data received from the API from being
     * interpreted as HTML.
     *
     */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    loadERPProgress();

  </script>

</body>
</html>
