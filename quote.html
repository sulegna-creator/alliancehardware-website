<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request a Quote | Alliance Hardware, Inc.</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="products-header">

<h1>Request a Quote</h1>

<p>

Tell us about your project and we'll prepare
the best quotation for your requirements.

</p>

</header>

<section class="quote-page">

<div class="container">

<div class="quote-box">

<h2>Quotation Request Form</h2>

<form>

<div class="form-grid">

<input type="text" placeholder="Company Name">

<input type="text" placeholder="Contact Person" required>

<input type="email" placeholder="Email Address" required>

<input type="text" placeholder="Mobile Number" required>

<input type="text" placeholder="Project Name">

<select>

<option selected disabled>

Select Product Category

</option>

<option>Waterworks Materials</option>

<option>Safety Equipment</option>

<option>Construction Materials</option>

<option>Industrial Hardware</option>

<option>Electrical Supplies</option>

<option>Plumbing Supplies</option>

</select>

<input type="text" placeholder="Estimated Quantity">

<input type="text" placeholder="Project Location">

<input type="date">

</div>

<textarea
placeholder="Please describe the products you need, preferred brands, specifications, or any additional requirements."
></textarea>

<button type="submit">

Request Quotation

</button>

</form>

</div>

</div>

</section>

</body>

</html>
